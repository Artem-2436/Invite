<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INVITATION OS</title>
    <style>
        /* === RESET & BASE === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        /* === SCROLLBAR HIDING === */
        ::-webkit-scrollbar {
            display: none;
        }

        body {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* === WORKSPACE === */
        #desktop {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            position: relative;
            padding: 20px;
            padding-bottom: 80px; /* Отступ под taskbar */
        }

        /* === TASKBAR === */
        #taskbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: rgba(20, 20, 30, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 9999;
        }

        #taskbar-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        #taskbar-center {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #taskbar-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .taskbar-icon {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .taskbar-icon:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        #clock {
            color: white;
            font-size: 14px;
            font-weight: 500;
        }

        /* === WINDOWS CONTAINER === */
        #windows-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        .window {
            position: absolute;
            background: rgba(30, 30, 40, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: auto;
            min-width: 300px;
            min-height: 200px;
            display: none;
        }

        .window.active {
            display: block;
        }

        .window-header {
            height: 40px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px 12px 0 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            cursor: move;
            user-select: none;
        }

        .window-title {
            color: white;
            font-size: 14px;
            font-weight: 500;

        }

        .window-controls {
            display: flex;
            gap: 8px;
        }

        .window-control-btn {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .window-control-btn:hover {
            opacity: 0.8;
        }

        .btn-close {
            background: #ff5f57;
        }

        .btn-minimize {
            background: #ffbd2e;
        }

        .btn-maximize {
            background: #28ca42;
        }

        .window-content {
            padding: 20px;
            color: white;
            height: calc(100% - 40px);
            overflow: auto;
        }

        /* === RESPONSIVE === */
        @media (max-width: 768px) {
            #desktop {
                padding: 10px;
                padding-bottom: 70px;
            }

            #taskbar {
                height: 50px;
                padding: 0 10px;
            }

            .taskbar-icon {
                width: 35px;
                height: 35px;
            }

            #clock {
                font-size: 12px;
            }

            .window {
                min-width: 90%;
                width: 90% !important;
                left: 5% !important;
                right: 5% !important;
            }
        }

        @media (max-width: 480px) {
            #taskbar-center {
                display: none;
            }

            .window {
                min-width: 95%;
                width: 95% !important;
                left: 2.5% !important;
            }
        }
        /* === DESKTOP ICONS === */
#desktop-icons {
    display: grid;
    grid-template-columns: repeat(auto-fill, 100px);
    gap: 25px 15px;
    padding: 20px;
    width: 100%;
    height: calc(100% - 80px); /* Учитываем taskbar */
    align-content: start;
    overflow-y: auto;
}

.desktop-icon {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    padding: 10px;
    border-radius: 10px;
    transition: all 0.25s ease;
    user-select: none;
    width: 100px;
}

.desktop-icon:hover {
    background: rgba(255, 255, 255, 0.15);
    transform: translateY(-3px);
}

.desktop-icon:active {
    transform: scale(0.95);
}

.icon-image {
    width: 60px;
    height: 60px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
}

.icon-image::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.3) 0%, transparent 50%);
    border-radius: 14px;
}

.desktop-icon:hover .icon-image {
    box-shadow: 0 6px 25px rgba(0, 0, 0, 0.35), 0 0 20px rgba(255, 255, 255, 0.2);
    transform: scale(1.05);
}

.icon-emoji {
    font-size: 30px;
    position: relative;
    z-index: 1;
    filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
}

.icon-label {
    color: white;
    font-size: 12px;
    font-weight: 500;
    text-align: center;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
    max-width: 90px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

/* === DESKTOP ICONS RESPONSIVE === */
@media (max-width: 768px) {
    #desktop-icons {
        grid-template-columns: repeat(auto-fill, 90px);
        gap: 20px 10px;
        padding: 15px;
        height: calc(100% - 70px);
    }

    .desktop-icon {
        width: 90px;
        padding: 8px;
    }

    .icon-image {
        width: 55px;
        height: 55px;
    }

    .icon-emoji {
        font-size: 26px;
    }

    .icon-label {
        font-size: 11px;
    }
}

@media (max-width: 480px) {
    #desktop-icons {
        grid-template-columns: repeat(3, 1fr);
        gap: 15px 8px;
        padding: 10px;
        justify-items: center;
    }

    .desktop-icon {
        width: 100%;
        max-width: 90px;
    }
}
    </style>
</head>
<body>
    <!-- === DESKTOP === -->
    <div id="desktop">
        <!-- === DESKTOP ICONS === -->
<div id="desktop-icons">
    <div class="desktop-icon" data-app="invitations">
        <div class="icon-image" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
            <span class="icon-emoji">📧</span>
        </div>
        <span class="icon-label">Приглашения</span>
    </div>

    <div class="desktop-icon" data-app="calendar">
        <div class="icon-image" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);">
            <span class="icon-emoji">📅</span>
        </div>
        <span class="icon-label">Календарь</span>
    </div>

    <div class="desktop-icon" data-app="contacts">
        <div class="icon-image" style="background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);">
            <span class="icon-emoji">👥</span>
        </div>
        <span class="icon-label">Контакты</span>
    </div>

    <div class="desktop-icon" data-app="notes">
        <div class="icon-image" style="background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);">
            <span class="icon-emoji">📝</span>
        </div>
        <span class="icon-label">Заметки</span>
    </div>

    <div class="desktop-icon" data-app="gallery">
        <div class="icon-image" style="background: linear-gradient(135deg, #30cfd0 0%, #330867 100%);">
            <span class="icon-emoji">🖼️</span>
        </div>
        <span class="icon-label">Галерея</span>
    </div>

    <div class="desktop-icon" data-app="design">
        <div class="icon-image" style="background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);">
            <span class="icon-emoji">🎨</span>
        </div>
        <span class="icon-label">Дизайн</span>
    </div>

    <div class="desktop-icon" data-app="stats">
        <div class="icon-image" style="background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);">
            <span class="icon-emoji">📊</span>
        </div>
        <span class="icon-label">Статистика</span>
    </div>

    <div class="desktop-icon" data-app="settings">
        <div class="icon-image" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
            <span class="icon-emoji">⚙️</span>
        </div>
        <span class="icon-label">Настройки</span>
    </div>
</div>
    </div>

    <!-- === WINDOWS CONTAINER === -->
    <div id="windows-container">
        <!-- Здесь будут создаваться окна приложений (Блок 3) -->
    </div>

    <!-- === TASKBAR === -->
    <div id="taskbar">
        <div id="taskbar-left">
            <!-- Кнопка "Пуск" и закрепленные приложения -->
        </div>
        
        <div id="taskbar-center">
            <!-- Открытые приложения -->
        </div>
        
        <div id="taskbar-right">
            <div id="clock">--:--</div>
        </div>
    </div>

    <!-- === JAVASCRIPT === -->
    <script>
        // Пустая заглушка для JS логики (Блок 4+)
    </script>
</body>
</html>
