<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INVITATION OS</title>
    <style>
        /* === RESET & BASE === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        /* === SCROLLBAR HIDING === */
        ::-webkit-scrollbar {
            display: none;
        }

        body {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* === WORKSPACE === */
        #desktop {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            position: relative;
            padding: 20px;
            padding-bottom: 80px; /* Отступ под taskbar */
        }

        /* === TASKBAR === */
        #taskbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: rgba(20, 20, 30, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 9999;
        }

        #taskbar-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        #taskbar-center {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #taskbar-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .taskbar-icon {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .taskbar-icon:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        #clock {
            color: white;
            font-size: 14px;
            font-weight: 500;
        }

        /* === WINDOWS CONTAINER === */
        #windows-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        .window {
            position: absolute;
            background: rgba(30, 30, 40, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: auto;
            min-width: 300px;
            min-height: 200px;
            display: none;
        }

        .window.active {
            display: block;
        }

        .window-header {
            height: 40px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px 12px 0 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            cursor: move;
            user-select: none;
        }

        .window-title {
            color: white;
            font-size: 14px;
            font-weight: 500;

        }

        .window-controls {
            display: flex;
            gap: 8px;
        }

        .window-control-btn {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .window-control-btn:hover {
            opacity: 0.8;
        }

        .btn-close {
            background: #ff5f57;
        }

        .btn-minimize {
            background: #ffbd2e;
        }

        .btn-maximize {
            background: #28ca42;
        }

        .window-content {
            padding: 20px;
            color: white;
            height: calc(100% - 40px);
            overflow: auto;
        }

        /* === RESPONSIVE === */
        @media (max-width: 768px) {
            #desktop {
                padding: 10px;
                padding-bottom: 70px;
            }

            #taskbar {
                height: 50px;
                padding: 0 10px;
            }

            .taskbar-icon {
                width: 35px;
                height: 35px;
            }

            #clock {
                font-size: 12px;
            }

            .window {
                min-width: 90%;
                width: 90% !important;
                left: 5% !important;
                right: 5% !important;
            }
        }

        @media (max-width: 480px) {
            #taskbar-center {
                display: none;
            }

            .window {
                min-width: 95%;
                width: 95% !important;
                left: 2.5% !important;
            }
        }
        /* === DESKTOP ICONS === */
#desktop-icons {
    display: grid;
    grid-template-columns: repeat(auto-fill, 100px);
    gap: 25px 15px;
    padding: 20px;
    width: 100%;
    height: calc(100% - 80px); /* Учитываем taskbar */
    align-content: start;
    overflow-y: auto;
}

.desktop-icon {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    padding: 10px;
    border-radius: 10px;
    transition: all 0.25s ease;
    user-select: none;
    width: 100px;
}

.desktop-icon:hover {
    background: rgba(255, 255, 255, 0.15);
    transform: translateY(-3px);
}

.desktop-icon:active {
    transform: scale(0.95);
}

.icon-image {
    width: 60px;
    height: 60px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
}

.icon-image::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.3) 0%, transparent 50%);
    border-radius: 14px;
}

.desktop-icon:hover .icon-image {
    box-shadow: 0 6px 25px rgba(0, 0, 0, 0.35), 0 0 20px rgba(255, 255, 255, 0.2);
    transform: scale(1.05);
}

.icon-emoji {
    font-size: 30px;
    position: relative;
    z-index: 1;
    filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
}

.icon-label {
    color: white;
    font-size: 12px;
    font-weight: 500;
    text-align: center;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
    max-width: 90px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

/* === DESKTOP ICONS RESPONSIVE === */
@media (max-width: 768px) {
    #desktop-icons {
        grid-template-columns: repeat(auto-fill, 90px);
        gap: 20px 10px;
        padding: 15px;
        height: calc(100% - 70px);
    }

    .desktop-icon {
        width: 90px;
        padding: 8px;
    }

    .icon-image {
        width: 55px;
        height: 55px;
    }

    .icon-emoji {
        font-size: 26px;
    }

    .icon-label {
        font-size: 11px;
    }
}

@media (max-width: 480px) {
    #desktop-icons {
        grid-template-columns: repeat(3, 1fr);
        gap: 15px 8px;
        padding: 10px;
        justify-items: center;
    }

    .desktop-icon {
        width: 100%;
        max-width: 90px;
    }
}
        /* === ANIMATIONS === */
@keyframes windowOpen {
    from { opacity: 0; transform: scale(0.95) translateY(10px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
}

@keyframes windowClose {
    from { opacity: 1; transform: scale(1); }
    to { opacity: 0; transform: scale(0.95); }
}

.window.active {
    animation: windowOpen 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.window.closing {
    animation: windowClose 0.15s ease-in forwards;
    pointer-events: none;
}

/* Prevent text selection while dragging */
body.dragging {
    user-select: none;
    -webkit-user-select: none;
    cursor: grabbing !important;
}

.window-header:active {
    cursor: grabbing;
}

/* === CONTEXT MENU === */
#context-menu {
    position: fixed;
    display: none;
    min-width: 180px;
    background: rgba(30, 30, 40, 0.95);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    padding: 6px;
    z-index: 99999;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    animation: ctxFadeIn 0.15s ease-out;
}

@keyframes ctxFadeIn {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
}

.ctx-item {
    padding: 8px 14px;
    color: rgba(255, 255, 255, 0.9);
    font-size: 13px;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: background 0.15s;
}

.ctx-item:hover {
    background: rgba(255, 255, 255, 0.12);
}

.ctx-separator {
    height: 1px;
    background: rgba(255, 255, 255, 0.08);
    margin: 4px 8px;
}

/* === TASKBAR ACTIVE INDICATOR === */
.taskbar-app-indicator {
    width: 40px;
    height: 40px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s ease;
    position: relative;
}

.taskbar-app-indicator:hover {
    background: rgba(255, 255, 255, 0.18);
}

.taskbar-app-indicator.active::after {
    content: '';
    position: absolute;
    bottom: -4px;
    left: 50%;
    transform: translateX(-50%);
    width: 16px;
    height: 3px;
    background: #764ba2;
    border-radius: 2px;
}

.taskbar-app-indicator .icon-emoji {
    font-size: 20px;
}
    </style>
</head>
<body>
    <!-- === DESKTOP === -->
    <div id="desktop">
        <!-- === DESKTOP ICONS === -->
<div id="desktop-icons">
    <div class="desktop-icon" data-app="invitations">
        <div class="icon-image" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
            <span class="icon-emoji">📧</span>
        </div>
        <span class="icon-label">Приглашения</span>
    </div>

    <div class="desktop-icon" data-app="calendar">
        <div class="icon-image" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);">
            <span class="icon-emoji">📅</span>
        </div>
        <span class="icon-label">Календарь</span>
    </div>

    <div class="desktop-icon" data-app="contacts">
        <div class="icon-image" style="background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);">
            <span class="icon-emoji">👥</span>
        </div>
        <span class="icon-label">Контакты</span>
    </div>

    <div class="desktop-icon" data-app="notes">
        <div class="icon-image" style="background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);">
            <span class="icon-emoji">📝</span>
        </div>
        <span class="icon-label">Заметки</span>
    </div>

    <div class="desktop-icon" data-app="gallery">
        <div class="icon-image" style="background: linear-gradient(135deg, #30cfd0 0%, #330867 100%);">
            <span class="icon-emoji">🖼️</span>
        </div>
        <span class="icon-label">Галерея</span>
    </div>

    <div class="desktop-icon" data-app="design">
        <div class="icon-image" style="background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);">
            <span class="icon-emoji">🎨</span>
        </div>
        <span class="icon-label">Дизайн</span>
    </div>

    <div class="desktop-icon" data-app="stats">
        <div class="icon-image" style="background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);">
            <span class="icon-emoji">📊</span>
        </div>
        <span class="icon-label">Статистика</span>
    </div>

    <div class="desktop-icon" data-app="settings">
        <div class="icon-image" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
            <span class="icon-emoji">⚙️</span>
        </div>
        <span class="icon-label">Настройки</span>
    </div>
</div>
    </div>

    <!-- === WINDOWS CONTAINER === -->
    <div id="windows-container">
        <!-- Здесь будут создаваться окна приложений (Блок 3) -->
    </div>

    <!-- === TASKBAR === -->
    <div id="taskbar">
        <div id="taskbar-left">
            <!-- Кнопка "Пуск" и закрепленные приложения -->
        </div>
        
        <div id="taskbar-center">
            <!-- Открытые приложения -->
        </div>
        
        <div id="taskbar-right">
            <div id="clock">--:--</div>
        </div>
    </div>
    <!-- === CONTEXT MENU === -->
<div id="context-menu">
    <div class="ctx-item" data-action="refresh">🔄 Обновить рабочий стол</div>
    <div class="ctx-separator"></div>
    <div class="ctx-item" data-action="settings">⚙️ Настройки</div>
    <div class="ctx-item" data-action="about">ℹ️ О системе INVITATION OS</div>
</div>

    <!-- === JAVASCRIPT === -->
    
        <!-- === JAVASCRIPT LOGIC === -->
    <script>
        /* === CONFIGURATION & STATE === */
        const APPS = {
            invitations: { title: 'Приглашения', content: '<h2>Входящие приглашения</h2><p>У вас 3 новых запроса.</p>' },
            calendar: { title: 'Календарь', content: '<h2>Сентябрь 2026</h2><p>Ближайшее событие: Релиз OS.</p>' },
            contacts: { title: 'Контакты', content: '<h2>Список контактов</h2><ul><li>Алексей</li><li>Мария</li><li>Дмитрий</li></ul>' },
            notes: { title: 'Заметки', content: '<h2>Мои заметки</h2><textarea style="width:100%; height:80%; background:transparent; color:white; border:none; resize:none;">Купить молоко...\nПозвонить клиенту...</textarea>' },
            gallery: { title: 'Галерея', content: '<h2>Фотографии</h2><div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;"><div style="height:100px; background:#444;"></div><div style="height:100px; background:#555;"></div></div>' },
            design: { title: 'Дизайн-студия', content: '<h2>Инструменты дизайна</h2><p>Холст готов к работе.</p>' },
            stats: { title: 'Статистика', content: '<h2>Аналитика</h2><p>Посещаемость выросла на 15%.</p>' },
            settings: { title: 'Настройки', content: '<h2>Системные настройки</h2><label><input type="checkbox"> Темная тема (всегда вкл)</label>' }
        };

        let zIndexCounter = 1000;
        let activeWindow = null;
        let isDragging = false;
        let dragOffset = { x: 0, y: 0 };
        let currentDragWindow = null;

        /* === CLOCK FUNCTIONALITY === */
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}`;
        }
        setInterval(updateClock, 1000);
        updateClock(); // Initial call

        /* === WINDOW MANAGEMENT SYSTEM === */
        
        // 1. Open Window
        function openWindow(appId) {
            const appData = APPS[appId];
            if (!appData) return;

            // Check if window already exists
            let win = document.getElementById(`window-${appId}`);
            
            if (win) {
                // If minimized, restore it
                if (win.style.display === 'none') {
                    win.style.display = 'block';
                    bringToFront(win);
                } else {
                    // If already open and visible, just bring to front
                    bringToFront(win);
                }
                return;
            }

            // Create new window DOM structure
            win = document.createElement('div');
            win.id = `window-${appId}`;
            win.className = 'window active';
            win.style.zIndex = ++zIndexCounter;
            
            // Random initial position for "natural" feel
            const randomX = 50 + Math.random() * 100;
            const randomY = 50 + Math.random() * 100;
            win.style.left = `${randomX}px`;
            win.style.top = `${randomY}px`;
            win.style.width = '500px';
            win.style.height = '400px';

            win.innerHTML = `
                <div class="window-header">
                    <span class="window-title">${appData.title}</span>
                    <div class="window-controls">
                        <div class="window-control-btn btn-minimize" onclick="minimizeWindow('${appId}')"></div>
                        <div class="window-control-btn btn-maximize" onclick="maximizeWindow('${appId}')"></div>
                        <div class="window-control-btn btn-close" onclick="closeWindow('${appId}')"></div>
                    </div>
                </div>
                <div class="window-content">
                    ${appData.content}
                </div>
            `;

            // Add event listeners for interaction
            win.addEventListener('mousedown', () => bringToFront(win));
            
            const header = win.querySelector('.window-header');
            header.addEventListener('mousedown', (e) => startDrag(e, win));

            document.getElementById('windows-container').appendChild(win);
            bringToFront(win);
            
            // Add to taskbar (visual indicator logic can be added here later)
        }

        // 2. Close Window
        window.closeWindow = function(appId) {
            const win = document.getElementById(`window-${appId}`);
            if (win) {
                win.remove();
            }
        };

        // 3. Minimize Window (Hide)
        window.minimizeWindow = function(appId) {
            const win = document.getElementById(`window-${appId}`);
            if (win) {
                win.style.display = 'none';
            }
        };

        // 4. Maximize/Restore Window
        window.maximizeWindow = function(appId) {
            const win = document.getElementById(`window-${appId}`);
            if (!win) return;

            if (win.dataset.maximized === 'true') {
                // Restore
                win.style.width = win.dataset.prevWidth;
                win.style.height = win.dataset.prevHeight;
                win.style.top = win.dataset.prevTop;
                win.style.left = win.dataset.prevLeft;
                win.dataset.maximized = 'false';
            } else {
                // Maximize
                win.dataset.prevWidth = win.style.width;
                win.dataset.prevHeight = win.style.height;
                win.dataset.prevTop = win.style.top;
                win.dataset.prevLeft = win.style.left;
                
                win.style.width = '100%';
                win.style.height = 'calc(100% - 60px)'; // Minus taskbar
                win.style.top = '0';
                win.style.left = '0';
                win.dataset.maximized = 'true';
            }
        };

        // 5. Bring to Front
        function bringToFront(win) {
            if (activeWindow === win) return;
            zIndexCounter++;
            win.style.zIndex = zIndexCounter;
            activeWindow = win;
        }

        /* === DRAG AND DROP LOGIC === */
        function startDrag(e, win) {
            // Prevent dragging if maximized
            if (win.dataset.maximized === 'true') return;
            
            // Only drag if clicking the header (not controls)
            if (e.target.closest('.window-controls')) return;

            isDragging = true;
            currentDragWindow = win;
            
            // Calculate offset relative to the window
            const rect = win.getBoundingClientRect();
            dragOffset.x = e.clientX - rect.left;
            dragOffset.y = e.clientY - rect.top;

            bringToFront(win);
        }

        document.addEventListener('mousemove', (e) => {
            if (!isDragging || !currentDragWindow) return;

            let newX = e.clientX - dragOffset.x;
            let newY = e.clientY - dragOffset.y;

            // Boundary checks (optional, keeps window somewhat on screen)
            // const maxX = window.innerWidth - currentDragWindow.offsetWidth;
            // const maxY = window.innerHeight - 60 - currentDragWindow.offsetHeight; // 60 is taskbar
            
            // Simple constraints
            if (newY < 0) newY = 0;
            
            currentDragWindow.style.left = `${newX}px`;
            currentDragWindow.style.top = `${newY}px`;
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
            currentDragWindow = null;
        });

        /* === DESKTOP ICONS EVENT LISTENERS === */
        document.querySelectorAll('.desktop-icon').forEach(icon => {
            icon.addEventListener('click', () => {
                const appId = icon.getAttribute('data-app');
                openWindow(appId);
            });
        });

    </script>
    
</body>
</html>
